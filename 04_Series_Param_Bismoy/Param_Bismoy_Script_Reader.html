<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>পরম বিস্ময় বালক ঠাকুর — সম্পূর্ণ অডিও-ড্রামা পাঠ্যপুস্তক (৩২ পর্ব)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2e8;
    --surface: #fffdf8;
    --sidebar-bg: #efe7d6;
    --border: #dfd3bd;
    --text: #2a2118;
    --muted: #6c5b48;
    --accent: #b3541e;
    --accent-soft: #f5e2d3;
    --thakur-bg: #fff8e6;
    --thakur-border: #d99b26;
    --narrator-bg: #f6f0e4;
    --shadow: 0 4px 18px rgba(42, 33, 24, 0.06);
    --font-size: 19px;
  }
  [data-theme="light"] {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --sidebar-bg: #eef1f6;
    --border: #dce2ec;
    --text: #1b2230;
    --muted: #5b677a;
    --accent: #c2410c;
    --accent-soft: #ffedd5;
    --thakur-bg: #fffbeb;
    --thakur-border: #d97706;
    --narrator-bg: #f8fafc;
  }
  [data-theme="dark"] {
    --bg: #151412;
    --surface: #1e1c19;
    --sidebar-bg: #191714;
    --border: #332d25;
    --text: #ede6da;
    --muted: #a69885;
    --accent: #e58e49;
    --accent-soft: #352519;
    --thakur-bg: #272217;
    --thakur-border: #c9922c;
    --narrator-bg: #23201b;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif Bengali', 'Hind Siliguri', 'Nirmala UI', 'Vrinda', serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }

  /* Sidebar */
  .sidebar {
    width: 320px;
    min-width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    z-index: 20;
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.3;
  }
  .brand-sub {
    margin: 4px 0 12px;
    font-size: 13px;
    color: var(--muted);
    font-family: 'Hind Siliguri', sans-serif;
  }
  .search-box {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  .episode-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 24px;
  }
  .season-group { margin-bottom: 12px; }
  .season-header {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 6px;
    user-select: none;
  }
  .season-header:hover { background: rgba(128,128,128,0.08); }
  .ep-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 10px;
    margin: 2px 0;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 14px;
    line-height: 1.35;
    color: var(--text);
    border: 1px solid transparent;
    transition: background 0.15s;
  }
  .ep-item:hover { background: rgba(179, 84, 30, 0.08); }
  .ep-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    font-weight: 600;
  }
  .ep-num {
    min-width: 26px;
    height: 24px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* Main Area */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .topbar {
    height: 58px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    font-family: 'Hind Siliguri', sans-serif;
  }
  .topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .menu-btn { display: none; }

  /* Reader Scroll Container */
  .reader-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 70px;
  }
  .reader-page {
    max-width: 820px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 42px;
    box-shadow: var(--shadow);
  }
  .ep-banner {
    border-bottom: 2px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 28px;
    text-align: center;
  }
  .ep-season-tag {
    display: inline-block;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .ep-title-bn {
    margin: 4px 0;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
  }
  .ep-title-en {
    margin: 4px 0 0;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 15px;
    color: var(--muted);
  }

  /* Scene Divider */
  .scene-divider {
    margin: 30px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .scene-divider::before, .scene-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .scene-meta-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    font-family: 'Hind Siliguri', sans-serif;
  }
  .pill {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* Dialogue Blocks */
  .block-card {
    margin: 14px 0;
    padding: 16px 20px;
    border-radius: 12px;
    border-left: 4px solid var(--border);
    background: transparent;
    transition: background 0.15s;
  }
  .block-card.is-narrator {
    background: var(--narrator-bg);
    border-left-color: #8c7a64;
  }
  .block-card.is-thakur {
    background: var(--thakur-bg);
    border-left-color: var(--thakur-border);
  }
  .block-card.is-dialogue {
    background: var(--bg);
    border-left-color: var(--accent);
  }
  .block-card.is-intro-outro {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  .block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
    font-family: 'Hind Siliguri', sans-serif;
  }
  .speaker-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
  }
  .block-card.is-thakur .speaker-name { color: #b4690e; }
  [data-theme="dark"] .block-card.is-thakur .speaker-name { color: #f0b44c; }
  .block-card.is-narrator .speaker-name { color: var(--muted); }

  .studio-badge {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 6px;
    font-family: monospace;
  }
  .style-note {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 13.5px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .speech-text {
    font-size: var(--font-size);
    line-height: 1.85;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .tag-pause {
    display: inline-block;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 12px;
    color: var(--muted);
    background: rgba(128,128,128,0.12);
    padding: 0 6px;
    border-radius: 4px;
    margin: 0 3px;
    vertical-align: middle;
  }
  .tag-laugh {
    display: inline-block;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 12px;
    color: #b45309;
    background: #fef3c7;
    padding: 0 6px;
    border-radius: 4px;
    margin: 0 3px;
    vertical-align: middle;
  }
  .tag-whisper {
    font-style: italic;
    opacity: 0.88;
    border-bottom: 1px dashed var(--muted);
  }

  .copy-row {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .copy-btn {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  .studio-only { display: none; }
  body.studio-mode .studio-only { display: inline-flex; }
  body.studio-mode .studio-block { display: block; }
  .studio-block { display: none; }

  .nav-footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: 'Hind Siliguri', sans-serif;
  }

  /* Cast Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    color: var(--text);
    max-width: 720px;
    width: 100%;
    max-height: 82vh;
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Hind Siliguri', sans-serif;
  }
  .modal-body {
    padding: 16px 20px;
    overflow-y: auto;
    font-family: 'Hind Siliguri', sans-serif;
  }
  .cast-row {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-size: 14px;
  }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,0.4); }
    .menu-btn { display: inline-flex; }
    .reader-page { padding: 22px 18px; }
    .ep-title-bn { font-size: 24px; }
  }
</style>
</head>

h_prophecy", "save_as": "01a_Narrator_1919.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Speak in a warm, calm, soulful, cinematic Bengali female narrator voice—like a classic literary film storyteller (gentler, natural, deeply evocative, NOT overly theatrical or melodramatic, measured pacing, soft resonance).", "speech": "উনিশশো উনিশ সাল। প্রথম বিশ্বযুদ্ধের ক্ষত আর প্রলয়ঙ্করী আশ্বিনের ঘূর্ণিঝড়ে পূর্ববাংলা তখন টালমাটাল। <short pause> আর সেই যুগসন্ধিক্ষণের বহু বছর আগেই—এক গভীর রাতে, বারদীর শান্ত তপোবন আশ্রমে, মহাযোগী লোকনাথ ব্রহ্মচারী তাঁর ভক্ত যোগেশ চৌধুরীকে কাছে ডেকে হাতে তুলে দিয়েছিলেন একখানি গেরুয়া বস্ত্র!"}, {"heading": "Scene `01_lokenath_prophecy` — `01b_Lokenath_Prophecy.wav`", "scene_id": "01_lokenath_prophecy", "save_as": "01b_Lokenath_Prophecy.wav", "speaker_id": "bholagiri", "speaker_bn": "সাধক / ভোলাগিরি / সন্ন্যাসী", "preset": "Knox", "style": "Deep, prophetic, resonant sage voice filled with quiet certainty.", "speech": "যোগেশ, আজ আমি তোকে মন্ত্রদীক্ষা দেব না। <short pause> এই গেরুয়া কাপড়খানি সযত্নে রেখে দে। প্রায় অর্ধশত বছর পরে আসছেন এক পূর্ণব্রহ্ম অবতার! তিনি নিজে তোকে এই কাপড়ের কথা জিজ্ঞাসা করবেন—তাঁর কাছেই তোর মুক্তি!"}, {"heading": "Scene `01_lokenath_prophecy` — `01c_Jogesh_Awe.wav`", "scene_id": "01_lokenath_prophecy", "save_as": "01c_Jogesh_Awe.wav", "speaker_id": "scholar_gentleman", "speaker_bn": "পণ্ডিত / জমিদার / অফিসার", "preset": "Bodi", "style": "Hushed, trembling with reverent disbelief and wonder.", "speech": "<whisper> অর্ধশত বছর পরে… স্বয়ং পূর্ণব্রহ্ম? </whisper> <short pause> বাবা, আমি কি ততদিন বেঁচে থাকব তাঁর দেখা পাওয়ার জন্য?"}, {"heading": "Scene `01_lokenath_prophecy` — `01d_Lokenath_Smile.wav`", "scene_id": "01_lokenath_prophecy", "save_as": "01d_Lokenath_Smile.wav", "speaker_id": "bholagiri", "speaker_bn": "সাধক / ভোলাগিরি / সন্ন্যাসী", "preset": "Knox", "style": "Warm, knowing mystic chuckle, reassuring.", "speech": "<laugh> নিশ্চয়ই থাকবি! তাঁর ডাক এলে কালের hi.wav`", "scene_id": "02_shashthi_rain_control", "save_as": "02a_Narrator_Shashthi.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Intrigued, building quiet amazement.", "speech": "ছয় দিনের দিন ষষ্ঠীপূজা। গ্রামের ব্রাহ্মণরা আসবেন নবজাতককে পায়ের ধুলো দিতে। কিন্তু ভোর থেকেই মুষলধারে বৃষ্টি—কেউ আসতে পারলেন না! আর ঘরের ভেতর আত্মীয়রা দেখে অবাক—"}, {"heading": "Scene `02_shashthi_rain_control` — `02b_Thakurma_Rain.wav`", "scene_id": "02_shashthi_rain_control", "save_as": "02b_Thakurma_Rain.wav", "speaker_id": "thakurma", "speaker_bn": "ঠাকুরমা / বয়োজ্যেষ্ঠা", "preset": "Cleo", "style": "Startled, amazed, pointing in wonder.", "speech": "ওরে তোরা এদিকে এসে দ্যাখ! <short pause> খোকা যেমন ছোট্ট হাত দুটো জোরে নাড়ছে, বাইরে বৃষ্টিও অমনি মুষলধারে বাড়ছে! আবার হাত থামালেই বৃষ্টি কমে আসছে—এ কি মানুষের কাজ রে!"}, {"heading": "Scene `02_shashthi_rain_control` — `02c_Surendra_Awe.wav`", "scene_id": "02_shashthi_rain_control", "save_as": "02c_Surendra_Awe.wav", "speaker_id": "surendra", "speaker_bn": "পিতা সুরেন্দ্রচন্দ্র", "preset": "Achird", "style": "Quiet, deeply thoughtful fatherly tone.", "speech": "বড় আশ্চর্য মা! কারও পদধূলি যেন ও নিতে চাইল না—প্রকৃতিই যেন ওর ইশারায় খেলছে!"}, {"heading": "Scene `03_madhavacharya_mahim` — `03a_Narrator_Sages.wav`", "scene_id": "03_madhavacharya_mahim", "save_as": "03a_Narrator_Sages.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Reverent, warm storytelling.", "speech": "এই অদ্ভুত দেবশিশুর খবর ছড়িয়ে পড়ল উজানচর আর কৃষ্ণনগরে। দেখতে এলেন বিখ্যাত জ্যোতিষী মাধবাচার্য আর সাধক মহিম আচার্য।"}, {"heading": "Scene `03_madhavacharya_mahim` — `03b_Madhavacharya.wav`", "scene_id": "03_madhavacharya_mahim", "save_as": "03b_Madhavacharya.wav", "speaker_id": "scholar_gentleman", "speaker_bn": "পণ্ডিত / জমিদার / অফিসার", "preset": "Bodi", "style": "Deeply awed, scholarly amazement.", "speech": "সুরেন্দ্রবাবু, এ কোনো সাধারণ শিশু নয়! <short p ishor_Calm.wav", "speaker_id": "thakur_kishor", "speaker_bn": "বালক ঠাকুর (কিশোর)", "preset": "Mako", "style": "Steady, deeply compassionate, quietly authoritative.", "speech": "চাচা, শান্ত হয়ে বসুন। <short pause> আপনার ভেতরের ভয়টাই আসল বাধা। আপনি সৎ পথে আছেন—কাল সকালের মধ্যেই দেখবেন, জট খুলে যাবে। মন খুলে ঈশ্বরকে ডাকুন, আমি আপনার পাশেই আছি।"}, {"heading": "Scene `02_samads_father_crisis` — `02d_Samads_Father_Relief.wav`", "scene_id": "02_samads_father_crisis", "save_as": "02d_Samads_Father_Relief.wav", "speaker_id": "mystic_devotee", "speaker_bn": "ভক্ত / ফকির / কাঞ্চন-মান্না মিয়া", "preset": "Zali", "style": "Tears of relief, deeply grateful.", "speech": "খোদা তোমার মঙ্গল করুন বাবা! তোমার এই দুটো কথা শুনেই আমার বুকের পাথর যেন নেমে গেল!"}, {"heading": "Scene `03_practical_spiritual_balance` — `03a_Friend_Question.wav`", "scene_id": "03_practical_spiritual_balance", "save_as": "03a_Friend_Question.wav", "speaker_id": "youth_friend_1", "speaker_bn": "বন্ধু / যুবক ভক্ত ১", "preset": "Brio", "style": "Curious, playful adolescent banter.", "speech": "আচ্ছা ঠাকুর, তুই আমাদের সাথে খেলিস, পড়াশোনা করিস, আবার বড় বড় মানুষ তোর কাছে পরামর্শ নিতে আসে—তুই আসলে কে রে?"}, {"heading": "Scene `03_practical_spiritual_balance` — `03b_Thakur_Kishor_Smile.wav`", "scene_id": "03_practical_spiritual_balance", "save_as": "03b_Thakur_Kishor_Smile.wav", "speaker_id": "thakur_kishor", "speaker_bn": "বালক ঠাকুর (কিশোর)", "preset": "Mako", "style": "Playful, light laugh turning warm and wise.", "speech": "<laugh> আমি তো তোদেরই বন্ধু! <short pause> সংসারের কাজ ফেলে পালিয়ে যাওয়াটা ধর্ম নয় রে—সব কাজের মাঝেই মনটাকে পরিষ্কার রাখাটাই আসল সাধনা।"}, {"heading": "Block 99 — Sequential Closing & Next Episode Teaser", "scene_id": "99_closing_sequential_outro", "save_as": "99_Outro_Sequential.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Warm, calm, soulful Bengali female narrator slowing peacefully with gentle literary reflection, then buil edding` — `02a_Narrator_Wedding.wav`", "scene_id": "02_kanchan_mia_wedding", "save_as": "02a_Narrator_Wedding.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Warm, celebratory East Bengali evening.", "speech": "সেই রাতেই ছিল প্রিয় বন্ধু কাঞ্চন মিয়ার বিয়ে। উৎসবের আলোয় ঝলমল করছে বাড়ি। কিশোর ঠাকুর নিজে উপস্থিত থেকে সমস্ত আয়োজন তদারকি করলেন।"}, {"heading": "Scene `02_kanchan_mia_wedding` — `02b_Kanchan_Mia_Joy.wav`", "scene_id": "02_kanchan_mia_wedding", "save_as": "02b_Kanchan_Mia_Joy.wav", "speaker_id": "mystic_devotee", "speaker_bn": "ভক্ত / ফকির / কাঞ্চন-মান্না মিয়া", "preset": "Zali", "style": "Emotional, joyful gratitude.", "speech": "বালক ভাই, তুমি যে আমার বিয়েতে এসেছ, এটাই আমার জীবনের সবচেয়ে বড় উপহার! দোয়া করো, যেন সারাজীবন সৎ পথে চলতে পারি।"}, {"heading": "Scene `02_kanchan_mia_wedding` — `02c_Thakur_Kishor_Blessing.wav`", "scene_id": "02_kanchan_mia_wedding", "save_as": "02c_Thakur_Kishor_Blessing.wav", "speaker_id": "thakur_kishor", "speaker_bn": "বালক ঠাকুর (কিশোর)", "preset": "Mako", "style": "Warm, affectionate, luminous tone.", "speech": "তোর ঘর আলোয় ভরে উঠুক কাঞ্চন ভাই! <short pause> ভালোবাসা আর সততা যেখানে থাকে, সেখানে কোনো অভাব কোনোদিন ঢুকতে পারে না।"}, {"heading": "Block 99 — Sequential Closing & Next Episode Teaser", "scene_id": "99_closing_sequential_outro", "save_as": "99_Outro_Sequential.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Warm, calm, soulful Bengali female narrator slowing peacefully with gentle literary reflection, then building warm anticipation on the next-episode teaser.", "speech": "খেলার মাঠের আনন্দ হোক বা বন্ধুর বিয়ের উৎসব—সবার মাঝে মিশে গিয়েই ঠাকুর শিখিয়েছেন প্রকৃত ভ্রাতৃত্ববোধ। <short pause> পরম বিস্ময় বালক ঠাকুর—আসছে পরের পর্ব: স্কাউটস ও চন্দ্রনাথ পাহাড়! উনিশশো পঁয়ত্রিশের স্কাউটস সিলভার জুবিলি আর চন্দ্রনাথ পাহাড়ের চূড়ায় কিশোর ঠাকুরের রোমাঞ্চকর অভিজ্ঞতা—দেখুন পরের পর্বে!"}]}, {"num": 16, "season onder.", "speech": "পরম বিস্ময় বালক ঠাকুর—সিজন দুই, পর্ব ষোল: স্কাউটস ও চন্দ্রনাথ পাহাড়। <short pause> অধ্যাপক পি. কে. রায় রচিত অবিস্মরণীয় গ্রন্থ অবলম্বনে।"}, {"heading": "Scene `01_1935_scouts_jubilee` — `01a_Narrator_1935.wav`", "scene_id": "01_1935_scouts_jubilee", "save_as": "01a_Narrator_1935.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Crisp, proud historical storytelling.", "speech": "উনিশশো পঁয়ত্রিশ সাল। স্কাউটসের সিলভার জুবিলি ক্যাম্প। শৃঙ্খলা, সেবা আর ভ্রাতৃত্বের মন্ত্রে উজ্জীবিত কিশোর বালক ঠাকুর সবার মধ্যমণি!"}, {"heading": "Scene `01_1935_scouts_jubilee` — `01b_Scout_Leader.wav`", "scene_id": "01_1935_scouts_jubilee", "save_as": "01b_Scout_Leader.wav", "speaker_id": "ananda_master", "speaker_bn": "মাস্টারমশাই / শিক্ষক", "preset": "Jori", "style": "Proud, brisk, admiring scoutmaster.", "speech": "সাবাশ বালক! রাতের প্রহরায় হোক বা অসুস্থ বন্ধুর সেবায়—তুমি কখনো ক্লান্ত হও না। স্কাউটসের আসল আদর্শ তোমার মধ্যেই দেখছি!"}, {"heading": "Scene `01_1935_scouts_jubilee` — `01c_Thakur_Kishor_Service.wav`", "scene_id": "01_1935_scouts_jubilee", "save_as": "01c_Thakur_Kishor_Service.wav", "speaker_id": "thakur_kishor", "speaker_bn": "বালক ঠাকুর (কিশোর)", "preset": "Mako", "style": "Humble, spirited, clear youthful voice.", "speech": "স্যার, পরের উপকার করতে পারলে ক্লান্তি আসে না—বরং ভেতরে আরও বেশি শক্তি জমে ওঠে!"}, {"heading": "Scene `02_chandranath_hill_ascent` — `02a_Narrator_Chandranath.wav`", "scene_id": "02_chandranath_hill_ascent", "save_as": "02a_Narrator_Chandranath.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Sweeping, majestic mountain narration.", "speech": "সীতাকুণ্ডের দুর্গম চন্দ্রনাথ পাহাড়। মেঘে ঢাকা খাড়া সিঁড়ি বেয়ে উঠতে গিয়ে সহযাত্রীরা যখন হাঁপিয়ে উঠলেন, কিশোর ঠাকুর যেন হাওয়ার মতো এগিয়ে চললেন চূড়ার দিকে!"}, {"heading": "Scene `02_chandranath_hill_ascent` — `02b_Friend_Tired.wav`", "scene_id": "02_chandranath_hill_ascent", "s ষ, অগ্নিযুগের মহানায়ক—সুভাষচন্দ্র বসুর মুখোমুখি কিশোর বালক ঠাকুর!"}, {"heading": "Scene `02_netaji_subhas_historic_meeting` — `02b_Netaji_Greeting.wav`", "scene_id": "02_netaji_subhas_historic_meeting", "save_as": "02b_Netaji_Greeting.wav", "speaker_id": "netaji_subhas", "speaker_bn": "নেতাজি সুভাষচন্দ্র বসু", "preset": "Zubenelgenubi", "style": "Dignified, resolute, fiery patriot with deep spiritual sincerity.", "speech": "বালক, তোমার কথা আমি শুনেছি। <short pause> আজ গোটা দেশ পরাধীনতার শৃঙ্খলে বন্দী—চারদিকে শুধু হতাশা আর বিভেদ। তুমি বলো, এই জাতির মুক্তি কোন পথে?"}, {"heading": "Scene `02_netaji_subhas_historic_meeting` — `02c_Thakur_Kishor_Netaji.wav`", "scene_id": "02_netaji_subhas_historic_meeting", "save_as": "02c_Thakur_Kishor_Netaji.wav", "speaker_id": "thakur_kishor", "speaker_bn": "বালক ঠাকুর (কিশোর)", "preset": "Mako", "style": "Serene, luminous, profound spiritual-national vision.", "speech": "সুভাষদা, আপনার বুকে যে আগুন জ্বলছে, সেই আগুনই একদিন গোটা ভারতকে জাগাবে। <short pause> কিন্তু শুধু রাজনীতির স্বাধীনতা নয়—মানুষের চেতনাকেও স্বাধীন করতে হবে। আপনি এগিয়ে যান, মহাকালের আশীর্বাদ আপনার সাথে আছে!"}, {"heading": "Scene `02_netaji_subhas_historic_meeting` — `02d_Netaji_Moved.wav`", "scene_id": "02_netaji_subhas_historic_meeting", "save_as": "02d_Netaji_Moved.wav", "speaker_id": "netaji_subhas", "speaker_bn": "নেতাজি সুভাষচন্দ্র বসু", "preset": "Zubenelgenubi", "style": "Deeply stirred, voice resonant with renewed steel and reverence.", "speech": "তোমার চোখে এক অদ্ভুত জ্যোতি দেখছি ভাই! <short pause> তোমার এই কথা আমাকে নতুন শক্তি দিল। দেশমাতৃকার মুক্তির জন্য আমি আমার শেষ রক্তবিন্দু পর্যন্ত লড়ে যাব!"}, {"heading": "Scene `03_forest_creatures_and_infinite_love` — `03a_Narrator_S2_Close.wav`", "scene_id": "03_forest_creatures_and_infinite_love", "save_as": "03a_Narrator_S2_Close.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Poetic, soaring, transcendent finale cadence.", "speech": "নদীর পাড় ধরে শুধু মানুষ নয়—বনের পশু-পাখি, শিয়ালের দল আর জাতি সাপও যেন শান্ত হয়ে তাকিয়ে থাকে তাঁর দিকে! তিনি যে সবারই পরম আশ্রয়—যাঁকে যত দেখা যায়, ততই দেখার পিপাসা বেড়ে চলে!"}, {"heading": "Block 99 — Sequential Closing & Next Episode Teaser", "scene_id": "99_closing_sequential_outro", "save_as": "99_Outro_Sequential.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Warm, calm, soulful Bengali female narrator slowing peacefully with gentle literary reflection, then building warm anticipation on the next-episode teaser.", "speech": "মানুষের প্রতি সমদৃষ্টি আর দেশের প্রতি অগাধ ভালোবাসা—নেতাজি সুভাষচন্দ্রের সঙ্গে সেই ঐতিহাসিক সাক্ষাৎ আজও আমাদের হৃদয়ে অমর হয়ে আছে। <short pause> পরম বিস্ময় বালক ঠাকুর—আসছে পরের পর্ব: ঢাকায় মহামিলন: আনন্দময়ী মা ও রামঠাকুর! শুরু হচ্ছে সিজন তিন—ঢাকা ও কলকাতার মহাকাল! ভোলাগিরি মহারাজের ‘ব্রহ্মপুরুষ মিল গেলি’ আর আনন্দময়ী মায়ের সাথে অলৌকিক সাক্ষাৎ—দেখুন পরের পর্বে!"}]}]}, {"num": 3, "folder": "Season_03_Dhaka_Mahakal", "title_bn": "সিজন ৩: ঢাকা, কলকাতা ও মহাকাল", "title_en": "Season 3: Dhaka, Kolkata & 1947 Finale (Ep 21–32)", "episodes": [{"num": 21, "season": 3, "folder": "Episode_21_Anandamayi_Ma_and_Ram_Thakur", "title_bn": "ঢাকায় মহামিলন: আনন্দময়ী মা ও রামঠাকুর", "title_en": "Anandamayi Ma & Ram Thakur in Dhaka", "next_title_bn": "মান্নামিঞার বাবা ও ঢাকার লীলা", "is_finale": false, "scenes_meta": {"00_intro": {"scene_id": "00_intro", "lighting": "bright_orange_flat", "camera_motion": "bounce_title_pop", "characters": ["narrator"], "audio_files": ["00_Intro.wav"], "ambient_bed": "NONE", "music_cue": "Theme_Intro_Bansuri.wav", "sfx": ["chime_pop.wav"]}, "01_bholagiri_brahma_purush": {"scene_id": "01_bholagiri_brahma_purush", "lighting": "sacred_midnight_glow", "camera_motion": "slow_dolly_push_in", "characters": ["narrator", "bholagiri", "thakur_youth"], "audio_files": ["01a_Narrator_Dhaka.wav", "01b_Bholagiri_Ecstasy.wav", "01c_Thakur_Youth_Humble.wav"], "ambient_bed": "dawn_birds_temple.wav",  "উজানচর ছাড়িয়ে এবার শুরু হলো ঢাকা পর্ব! তরুণ বালক ঠাকুরের খ্যাতি তখন ছড়িয়ে পড়েছে বাংলার সাধু-সন্তদের মাঝে। একদিন ভোলাগিরি মহারাজ তাঁকে দেখেই আনন্দে আত্মহারা হয়ে উঠলেন!"}, {"heading": "Scene `01_bholagiri_brahma_purush` — `01b_Bholagiri_Ecstasy.wav`", "scene_id": "01_bholagiri_brahma_purush", "save_as": "01b_Bholagiri_Ecstasy.wav", "speaker_id": "bholagiri", "speaker_bn": "সাধক / ভোলাগিরি / সন্ন্যাসী", "preset": "Knox", "style": "Deep, weathered, ecstatically joyful mystic exclamation.", "speech": "<laugh> ব্রহ্মপুরুষ মিল গেলি! ব্রহ্মপুরুষ মিল গেলি! <short pause> আরে দেখ, যাঁর জন্য যুগে যুগে যোগীরা হিমালয়ে মাথা কোটে, তিনি আজ আমাদের সামনে দাঁড়িয়ে আছেন!"}, {"heading": "Scene `01_bholagiri_brahma_purush` — `01c_Thakur_Youth_Humble.wav`", "scene_id": "01_bholagiri_brahma_purush", "save_as": "01c_Thakur_Youth_Humble.wav", "speaker_id": "thakur_youth", "speaker_bn": "বালক ঠাকুর (তরুণ)", "preset": "Rami", "style": "Deep, calm, radiant young-adult warmth.", "speech": "মহারাজ, আপনি নিজেই তো তপস্যার সাগর! আপনার ভালোবাসাতেই আজ এই মিলন পূর্ণ হলো।"}, {"heading": "Scene `02_anandamayi_ma_meeting` — `02a_Narrator_Anandamayi.wav`", "scene_id": "02_anandamayi_ma_meeting", "save_as": "02a_Narrator_Anandamayi.wav", "speaker_id": "narrator", "speaker_bn": "কথক (Lady Narrator • Sola)", "preset": "Sola", "style": "Tender, deeply reverent storytelling.", "speech": "ঢাকার রমনা আশ্রমে সেদিন ঘটল এক অপূর্ব মহামিলন—আনন্দময়ী মায়ের সঙ্গে তরুণ বালক ঠাকুরের সাক্ষাৎ!"}, {"heading": "Scene `02_anandamayi_ma_meeting` — `02b_Anandamayi_Ma.wav`", "scene_id": "02_anandamayi_ma_meeting", "save_as": "02b_Anandamayi_Ma.wav", "speaker_id": "anandamayi_ma", "speaker_bn": "আনন্দময়ী মা", "preset": "Sola", "style": "Radiant, serene, playfully affectionate motherly voice.", "speech": "<laugh> এসো বাবা, এসো! এই শরীর তো অনেকদিন ধরেই তোমার আসার সুর শুনতে পাচ্ছিল! <short pause> তুমি এসেছ, আজ আশ্রমের বাতাসও আনন্দে হাসছে!"}, {"heading": "Scene `02_anandamayi_ma_meeting` — `02c_Thakur_Youth_Ma.wav`", "scene const allEpisodes = [];
SERIES_DATA.seasons.forEach(s => s.episodes.forEach(e => allEpisodes.push(e)));

let currentIndex = 0;
let fontSize = 19;
const themes = [
  { id: "sepia", label: "📜 কাগজ" },
  { id: "light", label: "☀️ সাদা" },
  { id: "dark",  label: "🌙 রাত" }
];
let themeIdx = 0;

function formatSpeechHTML(text) {
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  html = html.replace(/&lt;short pause&gt;/g, '<span class="tag-pause">• বিরতি •</span>');
  html = html.replace(/&lt;laugh&gt;/g, '<span class="tag-laugh">হাসি</span>');
  html = html.replace(/&lt;whisper&gt;([\s\S]*?)&lt;\/whisper&gt;/g, '<span class="tag-whisper">“$1”</span>');
  return html;
}

function renderSidebar(filter = "") {
  const list = document.getElementById("episodeList");
  list.innerHTML = "";
  const q = filter.trim().toLowerCase();

  SERIES_DATA.seasons.forEach(season => {
    const matchingEps = season.episodes.filter(ep => {
      if (!q) return true;
      return (
        ep.title_bn.toLowerCase().includes(q) ||
        ep.title_en.toLowerCase().includes(q) ||
        String(ep.num).includes(q) ||
        ep.blocks.some(b => b.speech.toLowerCase().includes(q))
      );
    });
    if (!matchingEps.length) return;

    const grp = document.createElement("div");
    grp.className = "season-group";

    const hdr = document.createElement("div");
    hdr.className = "season-header";
    hdr.innerHTML = `<span>${season.title_bn}</span><span>${matchingEps.length}</span>`;
    grp.appendChild(hdr);

    matchingEps.forEach(ep => {
      const globalIdx = allEpisodes.findIndex(x => x.num === ep.num);
      const item = document.createElement("div");
      item.className = "ep-item" + (globalIdx === currentIndex ? " active" : "");
      item.innerHTML = `<span class="ep-num">${String(ep.num).padStart(2, "0")}</span><span>${ep.title_bn}</span>`;
      item.onclick = () => {
        loadEpisode(globalIdx);
        document.getElementById("sidebar").classList.remove("open");
      };
      grp.appendChild(item);
    });
    list.appendChild(grp);
  });
}

function copyText(txt, btn) {
  navigator.clipboard.writeText(txt).then(() => {
    const old = btn.textContent;
    btn.textContent = "✓ কপি হয়েছে";
    setTimeout(() => btn.textContent = old, 1200);
  });
}

function loadEpisode(idx) {
  currentIndex = Math.max(0, Math.min(allEpisodes.length - 1, idx));
  const ep = allEpisodes[currentIndex];
  const season = SERIES_DATA.seasons.find(s => s.num === ep.season);
  const page = document.getElementById("readerPage");

  let html = `
    <div class="ep-banner">
      <div class="ep-season-tag">${season.title_bn} • পর্ব ${ep.num}</div>
      <h2 class="ep-title-bn">${ep.title_bn}</h2>
      <p class="ep-title-en">${ep.title_en} • মোট ${ep.blocks.length}টি সংলাপ অংশ</p>
    </div>
  `;

  let lastScene = null;
  ep.blocks.forEach((b, bi) => {
    if (b.scene_id !== lastScene) {
      lastScene = b.scene_id;
      if (b.scene_id !== "00_intro" && b.scene_id !== "99_closing_sequential_outro") {
        const scMeta = ep.scenes_meta[b.scene_id] || {};
        const niceScene = b.scene_id.replace(/^\d+_/, "").replace(/_/g, " ");
        html += `<div class="scene-divider">দৃশ্য: ${niceScene}</div>`;
        html += `<div class="scene-meta-pills studio-block">
          ${scMeta.lighting ? `<span class="pill">💡 ${scMeta.lighting}</span>` : ""}
          ${scMeta.ambient_bed && scMeta.ambient_bed !== "NONE" ? `<span class="pill">🌿 ${scMeta.ambient_bed}</span>` : ""}
          ${scMeta.music_cue ? `<span class="pill">🎵 ${scMeta.music_cue}</span>` : ""}
          ${(scMeta.sfx && scMeta.sfx.length) ? `<span class="pill">✨ ${scMeta.sfx.join(", ")}</span>` : ""}
        </div>`;
      }
    }

    let cardClass = "is-dialogue";
    if (b.scene_id === "00_intro" || b.scene_id === "99_closing_sequential_outro") {
      cardClass = "is-intro-outro";
    } else if (b.speaker_id === "narrator") {
      cardClass = "is-narrator";
    } else if (b.speaker_id.startsWith("thakur_")) {
      cardClass = "is-thakur";
    }

    html += `
      <section class="block-card ${cardClass}">
        <div class="block-header">
          <span class="speaker-name">${b.speaker_bn}</span>
          <span class="studio-badge studio-only">${b.save_as} • ${b.preset}</span>
        </div>
        <div class="style-note">${b.style}</div>
        <p class="speech-text">${formatSpeechHTML(b.speech)}</p>
        <div class="copy-row studio-only">
          <button class="copy-btn" data-copy-type="style" data-bi="${bi}">📋 Style কপি</button>
          <button class="copy-btn" data-copy-type="speech" data-bi="${bi}">📋 Speech কপি</button>
        </div>
      </section>
    `;
  });

  const prevBtn = currentIndex > 0
    ? `<button class="btn" onclick="loadEpisode(${currentIndex - 1})">← আগের পর্ব (${allEpisodes[currentIndex - 1].title_bn})</button>`
    : `<span></span>`;
  const nextBtn = currentIndex < allEpisodes.length - 1
    ? `<button class="btn" onclick="loadEpisode(${currentIndex + 1})">পরের পর্ব (${allEpisodes[currentIndex + 1].title_bn}) →</button>`
    : `<span class="pill">✨ সমাপ্ত ✨</span>`;

  html += `<div class="nav-footer">${prevBtn}${nextBtn}</div>`;
  page.innerHTML = html;

  page.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
      const b = ep.blocks[Number(btn.dataset.bi)];
      const txt = btn.dataset.copyType === "style" ? b.style : b.speech;
      copyText(txt, btn);
    };
  });

  document.getElementById("readerScroll").scrollTop = 0;
  renderSidebar(document.getElementById("searchInput").value);
  localStorage.setItem("param_bismoy_last_ep", String(currentIndex));
}

document.getElementById("modeStoryBtn").onclick = () => {

  document.getElementById("modeStoryBtn").classList.add("active");
  document.getElementById("modeStudioBtn").classList.remove("active");
};
document.getElementById("modeStudioBtn").onclick = () => {
  document.body.classList.add("studio-mode");
  document.getElementById("modeStudioBtn").classList.add("active");
  document.getElementById("modeStoryBtn").classList.remove("active");
};

document.getElementById("fontUpBtn").onclick = () => {
  fontSize = Math.min(28, fontSize + 2);
  document.documentElement.style.setProperty("--font-size", fontSize + "px");
};
document.getElementById("fontDownBtn").onclick = () => {
  fontSize = Math.max(14, fontSize - 2);
  document.documentElement.style.setProperty("--font-size", fontSize + "px");
};
document.getElementById("themeBtn").onclick = () => {
  themeIdx = (themeIdx + 1) % themes.length;
  document.body.setAttribute("data-theme", themes[themeIdx].id);
  document.getElementById("themeBtn").textContent = themes[themeIdx].label;
};

// Cast modal
const castBody = document.getElementById("castBody");
SERIES_DATA.characters.forEach(c => {
  const row = document.createElement("div");
  row.className = "cast-row";
  row.innerHTML = `<div><strong>${c.name}</strong><div style="color:var(--muted);font-size:13px">${c.role}</div></div><span class="studio-badge">${c.voice_id}</span>`;
  castBody.appendChild(row);
});
document.getElementById("castBtn").onclick = () => document.getElementById("castModal").classList.add("open");
document.getElementById("closeCastBtn").onclick = () => document.getElementById("castModal").classList.remove("open");
document.getElementById("castModal").onclick = (e) => {
  if (e.target.id === "castModal") document.getElementById("castModal").classList.remove("open");
};

// Keyboard arrows
window.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && currentIndex < allEpisodes.length - 1) loadEpisode(currentIndex + 1);
  if (e.key === "ArrowLeft" && currentIndex > 0) loadEpisode(currentIndex - 1);
});

const saved = Number(localStorage.getItem("param_bismoy_last_ep") || "0");
loadEpisode(isNaN(saved) ? 0 : saved);
</script>
</body>
</html>
